 hitAt(id){const c=new THREE.Box3().setFromObject(ITEMS[id].g).getCenter(new THREE.Vector3());const v=c.project(camera);const h=pick((v.x*.5+.5)*innerWidth,(-v.y*.5+.5)*innerHeight,Object.values(ITEMS).filter(i=>i.g.visible).map(i=>i.g));const r=h&&rootOf(h.object);return [id,v.x.toFixed(2),v.y.toFixed(2),r&&r.userData.id]},
 clickPot(){const p=work.position;this.clickW(p.x,p.y+.9,p.z)},
 clickSoilLocal(x,z){const y=work.position.y+SY();this.clickW(work.position.x+x,y,work.position.z+z)},
 holdWater(ms){return new Promise(r=>{watering=true;setTimeout(()=>{watering=false;r()},ms)})},ITEMS};
})();
